<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OMNIDOSE | Smart Dosing Portal</title>

  <!-- Clean Modern Typography (English + Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'IBM Plex Sans Arabic', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            arabic: ['IBM Plex Sans Arabic', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F0FDFA',
              100: '#CCFBF1',
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
            }
          }
        }
      }
    }
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
    }
    html[dir="rtl"] body {
      font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', sans-serif;
    }
    .soft-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
    }
    input[type=range] {
      accent-color: #0D9488;
    }
  </style>
</head>

<body class="antialiased min-h-screen pb-24 sm:pb-12 selection:bg-brand-100 selection:text-brand-700"
      x-data="omnidoseApp()"
      x-init="init()"
      x-cloak>

  <!-- MINIMAL TOP BAR -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2.5">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-sm shrink-0">
          <i class="fa-solid fa-droplet text-base"></i>
        </div>
        <span class="font-extrabold text-lg tracking-tight text-slate-900">OMNIDOSE</span>
      </div>

      <!-- Right Controls: Language Switcher + Device Selector -->
      <div class="flex items-center gap-2">
        <!-- Bilingual Toggle Pill -->
        <button type="button"
                @click="toggleLang()"
                class="bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200/70 text-xs font-bold rounded-full px-3.5 py-2 transition flex items-center gap-1.5 shrink-0"
                :title="lang === 'en' ? 'التبديل إلى العربية' : 'Switch to English'">
          <i class="fa-solid fa-globe text-[11px]"></i>
          <span x-text="lang === 'en' ? 'عربي' : 'EN'"></span>
        </button>

        <!-- Simple Device Switcher Pill -->
        <div class="relative">
          <select x-model="selectedDeviceId"
                  @change="switchDevice()"
                  class="appearance-none bg-slate-100 hover:bg-slate-200/70 text-slate-800 text-xs sm:text-sm font-semibold rounded-full ltr:pl-3.5 ltr:pr-8 rtl:pr-3.5 rtl:pl-8 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500/40 transition cursor-pointer max-w-[155px] sm:max-w-none truncate">
            <template x-for="dev in devices" :key="dev.id">
              <option :value="dev.id" x-text="dev.name"></option>
            </template>
          </select>
          <i class="fa-solid fa-chevron-down text-slate-500 text-[10px] absolute ltr:right-3 rtl:left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </div>
      </div>

    </div>
  </header>

  <!-- CLEAN FLOATING TOAST -->
  <div x-show="toast.show"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-2"
       class="fixed bottom-20 sm:bottom-6 inset-x-4 sm:inset-x-auto sm:ltr:right-6 sm:rtl:left-6 z-50 max-w-sm mx-auto">
    <div class="bg-slate-900 text-white px-4 py-3.5 rounded-2xl shadow-xl flex items-center gap-3">
      <span class="w-2.5 h-2.5 rounded-full shrink-0"
            :class="{
              'bg-emerald-400': toast.type === 'success',
              'bg-amber-400': toast.type === 'warning',
              'bg-rose-500': toast.type === 'danger'
            }"></span>
      <p class="text-sm font-medium flex-1" x-text="toast.message"></p>
      <button @click="toast.show = false" class="text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 space-y-6">

    <!-- SEGMENTED PILL TABS (DESKTOP & TABLET) -->
    <div class="hidden sm:flex bg-slate-200/70 p-1 rounded-2xl w-fit">
      <button @click="tab = 'overview'"
              :class="tab === 'overview' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
              class="px-5 py-2 rounded-xl text-sm font-bold transition"
              x-text="t('navOverview')"></button>
      <button @click="tab = 'schedule'"
              :class="tab === 'schedule' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
              class="px-5 py-2 rounded-xl text-sm font-bold transition"
              x-text="t('navDosingSchedule')"></button>
      <button @click="tab = 'settings'"
              :class="tab === 'settings' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'"
              class="px-5 py-2 rounded-xl text-sm font-bold transition"
              x-text="t('navSettings')"></button>
    </div>

    <!-- ===================================== -->
    <!-- TAB 1: OVERVIEW (SIMPLE & FRIENDLY)   -->
    <!-- ===================================== -->
    <div x-show="tab === 'overview'" class="space-y-5">

      <!-- HERO CONTROL CARD -->
      <div class="soft-card rounded-3xl p-6 sm:p-8 space-y-6">
        
        <!-- Top Status Row -->
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2.5">
            <span class="w-3 h-3 rounded-full"
                  :class="{
                    'bg-brand-500 animate-ping': currentDevice.status === 'DISPENSING',
                    'bg-emerald-500': currentDevice.status === 'READY',
                    'bg-amber-400': currentDevice.status === 'PAUSED',
                    'bg-rose-500': currentDevice.status === 'STOPPED',
                    'bg-sky-400 animate-pulse': currentDevice.status === 'RESTARTING'
                  }"></span>
            <span class="text-sm font-bold"
                  :class="{
                    'text-brand-600': currentDevice.status === 'DISPENSING',
                    'text-emerald-700': currentDevice.status === 'READY',
                    'text-amber-600': currentDevice.status === 'PAUSED',
                    'text-rose-600': currentDevice.status === 'STOPPED',
                    'text-sky-600': currentDevice.status === 'RESTARTING'
                  }"
                  x-text="friendlyStatusLabel()"></span>
          </div>

          <span class="text-xs font-medium text-slate-400" x-text="t('updated') + ' ' + lastSync"></span>
        </div>

        <!-- Center Dose & Tank Visual -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center py-2">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="t('configuredDose')"></p>
            <div class="flex items-baseline gap-1.5 mt-1">
              <span class="text-5xl font-extrabold tracking-tight text-slate-900" x-text="Number(currentDevice.targetDoseMl).toFixed(1)"></span>
              <span class="text-xl font-bold text-slate-400" x-text="t('ml')"></span>
            </div>
            <p class="text-sm text-slate-500 mt-1" x-text="speedLabel(currentDevice.flowRateMlMin) + ' • ' + activeScheduleCount() + ' ' + t('activeTimers')"></p>
          </div>

          <!-- Reservoir Tank Level Pill -->
          <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 space-y-2.5">
            <div class="flex justify-between items-center text-sm">
              <span class="font-semibold text-slate-700" x-text="t('solutionReservoir')"></span>
              <span class="font-bold text-brand-600" x-text="currentDevice.reservoirPct + '%'"></span>
            </div>
            <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500"
                   :class="currentDevice.reservoirPct > 25 ? 'bg-brand-500' : 'bg-amber-500'"
                   :style="'width: ' + currentDevice.reservoirPct + '%'"></div>
            </div>
            <p class="text-xs text-slate-400" x-text="currentDevice.reservoirPct > 25 ? t('reservoirGood') : t('reservoirLow')"></p>
          </div>
        </div>

        <!-- Live Dispensing Progress (Only visible while dispensing) -->
        <div x-show="currentDevice.status === 'DISPENSING'"
             x-transition
             class="bg-brand-50 border border-brand-100 rounded-2xl p-4 space-y-2">
          <div class="flex justify-between text-xs font-bold text-brand-700">
            <span x-text="t('dispensingProgress')"></span>
            <span x-text="Math.round(progress) + '%'"></span>
          </div>
          <div class="w-full h-2.5 bg-brand-100 rounded-full overflow-hidden">
            <div class="h-full bg-brand-600 transition-all duration-200" :style="'width: ' + progress + '%'"></div>
          </div>
        </div>

        <!-- Primary Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button @click="dispenseNow()"
                  :disabled="currentDevice.status === 'DISPENSING' || currentDevice.status === 'STOPPED' || currentDevice.status === 'RESTARTING'"
                  :class="(currentDevice.status === 'DISPENSING' || currentDevice.status === 'STOPPED') ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-brand-600 hover:bg-brand-700 text-white shadow-md shadow-brand-600/20'"
                  class="flex-1 py-4 px-6 rounded-2xl font-bold text-base flex items-center justify-center gap-2.5 transition">
            <i class="fa-solid fa-droplet"></i>
            <span x-text="currentDevice.status === 'DISPENSING' ? t('dispensingBtn') : t('dispenseNow') + ' (' + Number(currentDevice.targetDoseMl).toFixed(1) + ' ' + t('ml') + ')'"></span>
          </button>

          <div class="flex gap-3">
            <button @click="togglePause()"
                    :disabled="currentDevice.status === 'STOPPED' || currentDevice.status === 'RESTARTING'"
                    :class="currentDevice.status === 'PAUSED' ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-slate-100 hover:bg-slate-200/80 text-slate-700 border-transparent'"
                    class="flex-1 sm:flex-none py-4 px-5 rounded-2xl font-bold text-sm border flex items-center justify-center gap-2 transition">
              <i :class="currentDevice.status === 'PAUSED' ? 'fa-solid fa-play' : 'fa-solid fa-pause'"></i>
              <span x-text="currentDevice.status === 'PAUSED' ? t('resume') : t('pause')"></span>
            </button>

            <button @click="emergencyStop()"
                    :class="currentDevice.status === 'STOPPED' ? 'bg-rose-600 text-white' : 'bg-rose-50 hover:bg-rose-100 text-rose-600'"
                    class="flex-1 sm:flex-none py-4 px-5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition">
              <i class="fa-solid fa-stop"></i>
              <span x-text="currentDevice.status === 'STOPPED' ? t('resetStop') : t('stop')"></span>
            </button>
          </div>
        </div>

      </div>

      <!-- 3 SIMPLE AT-A-GLANCE CARDS -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        
        <div class="soft-card rounded-2xl p-5 flex items-center gap-4">
          <div class="w-11 h-11 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg shrink-0">
            <i class="fa-solid fa-wifi"></i>
          </div>
          <div class="min-w-0">
            <p class="text-xs font-medium text-slate-400" x-text="t('connection')"></p>
            <p class="text-base font-bold text-slate-900" x-text="currentDevice.rssi >= -68 ? t('strongWifi') : t('fairWifi')"></p>
            <p class="text-xs text-slate-400 truncate" x-text="currentDevice.ssid + ' • ' + currentDevice.ip"></p>
          </div>
        </div>

        <div class="soft-card rounded-2xl p-5 flex items-center gap-4">
          <div class="w-11 h-11 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center text-lg shrink-0">
            <i class="fa-solid fa-check-double"></i>
          </div>
          <div class="min-w-0">
            <p class="text-xs font-medium text-slate-400" x-text="t('deliveredToday')"></p>
            <p class="text-base font-bold text-slate-900" x-text="currentDevice.dailyDispensedMl.toFixed(1) + ' ' + t('ml')"></p>
            <p class="text-xs text-slate-400" x-text="t('uptime') + ': ' + formatUptime(currentDevice.uptimeSec)"></p>
          </div>
        </div>

        <div class="soft-card rounded-2xl p-5 flex items-center gap-4">
          <div class="w-11 h-11 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center text-lg shrink-0">
            <i class="fa-regular fa-clock"></i>
          </div>
          <div class="min-w-0">
            <p class="text-xs font-medium text-slate-400" x-text="t('nextScheduled')"></p>
            <p class="text-base font-bold text-slate-900" x-text="nextScheduledDose()"></p>
            <p class="text-xs text-slate-400" x-text="currentDevice.firmware"></p>
          </div>
        </div>

      </div>

      <!-- CLEAN RECENT ACTIVITY LIST -->
      <div class="soft-card rounded-3xl p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-base font-bold text-slate-900" x-text="t('recentActivity')"></h3>
          <button @click="activityFeed = []" class="text-xs font-semibold text-slate-400 hover:text-slate-600" x-text="t('clear')"></button>
        </div>

        <div class="divide-y divide-slate-100">
          <template x-for="(item, idx) in activityFeed" :key="idx">
            <div class="py-3 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <span class="w-2 h-2 rounded-full shrink-0"
                      :class="{
                        'bg-brand-500': item.type === 'dose',
                        'bg-sky-500': item.type === 'sync',
                        'bg-amber-500': item.type === 'warn',
                        'bg-rose-500': item.type === 'stop'
                      }"></span>
                <span class="text-sm text-slate-700 font-medium" x-text="formatActivity(item)"></span>
              </div>
              <span class="text-xs text-slate-400 shrink-0" x-text="item.time"></span>
            </div>
          </template>
          <div x-show="activityFeed.length === 0" class="py-8 text-center text-sm text-slate-400" x-text="t('noActivity')"></div>
        </div>
      </div>

    </div>

    <!-- ===================================== -->
    <!-- TAB 2: DOSING & SCHEDULE              -->
    <!-- ===================================== -->
    <div x-show="tab === 'schedule'" class="space-y-6">

      <!-- Dose Amount & Speed Card -->
      <div class="soft-card rounded-3xl p-6 sm:p-8 space-y-6">
        <div>
          <h2 class="text-lg font-bold text-slate-900" x-text="t('doseAmountTitle')"></h2>
          <p class="text-sm text-slate-500" x-text="t('doseAmountDesc')"></p>
        </div>

        <!-- Dose Volume Slider -->
        <div class="space-y-3">
          <div class="flex justify-between items-baseline">
            <label class="text-sm font-semibold text-slate-700" x-text="t('targetDose')"></label>
            <span class="text-2xl font-extrabold text-brand-600" x-text="Number(currentDevice.targetDoseMl).toFixed(1) + ' ' + t('ml')"></span>
          </div>
          <input type="range" min="0.5" max="100" step="0.5" x-model.number="currentDevice.targetDoseMl" class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer" />
          <div class="flex justify-between text-xs text-slate-400">
            <span x-text="'0.5 ' + t('ml')"></span>
            <span x-text="'50 ' + t('ml')"></span>
            <span x-text="'100 ' + t('ml')"></span>
          </div>
        </div>

        <!-- Simple Speed Selector Pills -->
        <div class="space-y-2.5">
          <label class="text-sm font-semibold text-slate-700 block" x-text="t('dispensingSpeed')"></label>
          <div class="grid grid-cols-3 gap-2.5">
            <button type="button" @click="currentDevice.flowRateMlMin = 12"
                    :class="currentDevice.flowRateMlMin <= 15 ? 'bg-brand-50 border-brand-500 text-brand-700' : 'bg-slate-50 border-slate-200 text-slate-600'"
                    class="py-3 rounded-xl border text-sm font-bold transition"
                    x-text="t('speedGentle')"></button>
            <button type="button" @click="currentDevice.flowRateMlMin = 25"
                    :class="currentDevice.flowRateMlMin > 15 && currentDevice.flowRateMlMin <= 35 ? 'bg-brand-50 border-brand-500 text-brand-700' : 'bg-slate-50 border-slate-200 text-slate-600'"
                    class="py-3 rounded-xl border text-sm font-bold transition"
                    x-text="t('speedNormal')"></button>
            <button type="button" @click="currentDevice.flowRateMlMin = 50"
                    :class="currentDevice.flowRateMlMin > 35 ? 'bg-brand-50 border-brand-500 text-brand-700' : 'bg-slate-50 border-slate-200 text-slate-600'"
                    class="py-3 rounded-xl border text-sm font-bold transition"
                    x-text="t('speedFast')"></button>
          </div>
        </div>

        <!-- Fine Calibration Offset -->
        <div class="space-y-2 pt-2 border-t border-slate-100">
          <div class="flex justify-between text-xs">
            <span class="font-semibold text-slate-500" x-text="t('calibrationTrim')"></span>
            <span class="font-bold text-slate-700" dir="ltr" x-text="(currentDevice.calibrationOffset >= 0 ? '+' : '') + currentDevice.calibrationOffset + '%'"></span>
          </div>
          <input type="range" min="-15" max="15" step="0.5" x-model.number="currentDevice.calibrationOffset" class="w-full h-1.5 bg-slate-200 rounded-lg cursor-pointer" />
        </div>

        <button @click="saveDoseSettings()"
                class="w-full py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm transition shadow-sm"
                x-text="t('saveDosingBtn')"></button>
      </div>

      <!-- Automated Daily Schedules Card -->
      <div class="soft-card rounded-3xl p-6 sm:p-8 space-y-5">
        <div class="flex items-center justify-between gap-2">
          <div>
            <h2 class="text-lg font-bold text-slate-900" x-text="t('autoSchedulesTitle')"></h2>
            <p class="text-sm text-slate-500" x-text="t('autoSchedulesDesc')"></p>
          </div>
          <button @click="showAddSchedule = !showAddSchedule"
                  class="px-4 py-2 rounded-xl bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold text-xs transition shrink-0">
            <i class="fa-solid fa-plus me-1"></i>
            <span x-text="t('addTime')"></span>
          </button>
        </div>

        <!-- Inline Add Schedule Drawer -->
        <div x-show="showAddSchedule" x-transition class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input type="text" x-model="newRule.label" :placeholder="t('schedulePlaceholder')"
                   class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-500" />
            <input type="time" x-model="newRule.time"
                   class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-500" />
            <input type="number" step="0.5" min="0.5" max="100" x-model.number="newRule.volumeMl" :placeholder="t('amountPlaceholder')"
                   class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-500" />
          </div>
          <div class="flex justify-end gap-2">
            <button @click="showAddSchedule = false" class="px-4 py-2 text-xs font-semibold text-slate-500" x-text="t('cancel')"></button>
            <button @click="addSchedule()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold" x-text="t('saveSchedule')"></button>
          </div>
        </div>

        <!-- Schedule Items with RTL-Aware iOS-Style Toggles -->
        <div class="divide-y divide-slate-100">
          <template x-for="(rule, index) in schedules" :key="rule.id">
            <div class="py-4 flex items-center justify-between gap-4">
              <div>
                <div class="flex items-baseline gap-2.5">
                  <span class="text-xl font-extrabold text-slate-900" x-text="rule.time"></span>
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700" x-text="rule.volumeMl.toFixed(1) + ' ' + t('ml')"></span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5" x-text="scheduleDisplayLabel(rule) + ' • ' + t('daily')"></p>
              </div>

              <div class="flex items-center gap-3">
                <!-- iOS Toggle Switch (RTL + LTR Aware) -->
                <button type="button"
                        @click="rule.enabled = !rule.enabled; saveAll()"
                        :class="rule.enabled ? 'bg-brand-600' : 'bg-slate-200'"
                        class="w-12 h-7 rounded-full p-1 transition-colors duration-200 flex items-center">
                  <span :class="rule.enabled ? (lang === 'ar' ? '-translate-x-5' : 'translate-x-5') : 'translate-x-0'"
                        class="w-5 h-5 rounded-full bg-white shadow transform transition-transform duration-200"></span>
                </button>

                <button @click="removeSchedule(index)" class="text-slate-300 hover:text-rose-500 p-1.5 transition" :title="t('delete')">
                  <i class="fa-solid fa-trash-can text-sm"></i>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>

    </div>

    <!-- ===================================== -->
    <!-- TAB 3: SETTINGS & CLOUD SYNC          -->
    <!-- ===================================== -->
    <div x-show="tab === 'settings'" class="space-y-6">

      <!-- Device Name & Wi-Fi Card -->
      <div class="soft-card rounded-3xl p-6 sm:p-8 space-y-5">
        <div>
          <h2 class="text-lg font-bold text-slate-900" x-text="t('deviceWifiTitle')"></h2>
          <p class="text-sm text-slate-500" x-text="t('deviceWifiDesc')"></p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1.5" x-text="t('deviceName')"></label>
            <input type="text" x-model="currentDevice.name"

            presetAfternoon: 'جرعة الظهيرة',
            presetEvening: 'جرعة المساء'
          }
        },

        devices: [
          {
            id: 'OMNI-01',
            name: 'OMNIDOSE Unit 1',
            ssid: 'Home_WiFi_2.4G',
            ip: '192.168.1.142',
            rssi: -54,
            firmware: 'v2.4.1',
            uptimeSec: 148920,
            status: 'READY',
            reservoirPct: 86,
            targetDoseMl: 5.0,
            flowRateMlMin: 25,
            calibrationOffset: 0.0,
            dailyDispensedMl: 15.0
          },
          {
            id: 'OMNI-02',
            name: 'OMNIDOSE Unit 2',
            ssid: 'Home_WiFi_2.4G',
            ip: '192.168.1.148',
            rssi: -62,
            firmware: 'v2.4.1',
            uptimeSec: 86410,
            status: 'READY',
            reservoirPct: 64,
            targetDoseMl: 10.0,
            flowRateMlMin: 25,
            calibrationOffset: 0.0,
            dailyDispensedMl: 30.0
          }
        ],

        schedules: [
          { id: 1, presetKey: 'presetMorning', label: 'Morning Dose', time: '08:00', volumeMl: 5.0, enabled: true },
          { id: 2, presetKey: 'presetAfternoon', label: 'Afternoon Dose', time: '14:00', volumeMl: 5.0, enabled: true },
          { id: 3, presetKey: 'presetEvening', label: 'Evening Dose', time: '21:00', volumeMl: 2.5, enabled: false }
        ],

        newRule: { label: '', time: '12:00', volumeMl: 5.0 },

        activityFeed: [
          { type: 'dose', key: 'initial_dose', dose: 5.0, device: 'OMNIDOSE Unit 1', time: '08:00 AM' },
          { type: 'sync', key: 'connected', time: '07:58 AM' }
        ],

        get currentDevice() {
          return this.devices.find(d => d.id === this.selectedDeviceId) || this.devices[0];
        },

        t(key) {
          return (this.translations[this.lang] && this.translations[this.lang][key]) || key;
        },

        applyDirection() {
          document.documentElement.lang = this.lang;
          document.documentElement.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        },

        toggleLang() {
          this.lang = this.lang === 'en' ? 'ar' : 'en';
          localStorage.setItem('omni_lang', this.lang);
          this.applyDirection();
        },

        init() {
          const savedLang = localStorage.getItem('omni_lang');
          if (savedLang === 'ar' || savedLang === 'en') {
            this.lang = savedLang;
          }
          this.applyDirection();

          const savedDevs = localStorage.getItem('omni_simple_devices');
          if (savedDevs) { try { this.devices = JSON.parse(savedDevs); } catch (e) {} }
          const savedSched = localStorage.getItem('omni_simple_schedules');
          if (savedSched) { try { this.schedules = JSON.parse(savedSched); } catch (e) {} }
          const savedHook = localStorage.getItem('omni_simple_webhook');
          if (savedHook) this.webhookUrl = savedHook;

          this.updateLastSync();
          setInterval(() => {
            this.devices.forEach(d => {
              if (d.status !== 'RESTARTING') d.uptimeSec += 1;
            });
            this.updateLastSync();
          }, 1000);
        },

        updateLastSync() {
          const locale = this.lang === 'ar' ? 'ar-SA' : 'en-US';
          this.lastSync = new Date().toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
        },

        saveAll() {
          localStorage.setItem('omni_simple_devices', JSON.stringify(this.devices));
          localStorage.setItem('omni_simple_schedules', JSON.stringify(this.schedules));
          localStorage.setItem('omni_simple_webhook', this.webhookUrl);
        },

        friendlyStatusLabel() {
          const map = {
            READY: this.t('statusReady'),
            DISPENSING: this.t('statusDispensing'),
            PAUSED: this.t('statusPaused'),
            STOPPED: this.t('statusStopped'),
            RESTARTING: this.t('statusRestarting')
          };
          return map[this.currentDevice.status] || this.t('statusOnline');
        },

        speedLabel(rate) {
          if (rate <= 15) return this.t('speedGentle');
          if (rate <= 35) return this.t('speedNormal');
          return this.t('speedFast');
        },

        scheduleDisplayLabel(rule) {
          return rule.presetKey ? this.t(rule.presetKey) : rule.label;
        },

        activeScheduleCount() {
          return this.schedules.filter(s => s.enabled).length;
        },

        nextScheduledDose() {
          const active = this.schedules.find(s => s.enabled);
          return active ? `${active.time} (${active.volumeMl.toFixed(1)} ${this.t('ml')})` : this.t('noneActive');
        },

        formatUptime(sec) {
          const d = Math.floor(sec / 86400);
          const h = Math.floor((sec % 86400) / 3600);
          const m = Math.floor((sec % 3600) / 60);
          if (this.lang === 'ar') {
            return d > 0 ? `${d}ي ${h}س ${m}د` : `${h}س ${m}د`;
          }
          return d > 0 ? `${d}d ${h}h ${m}m` : `${h}h ${m}m`;
        },

        formatActivity(item) {
          const ar = this.lang === 'ar';
          switch (item.key) {
            case 'initial_dose':
              return ar ? `تم ضخ ${item.dose.toFixed(1)} مل (جرعة الصباح المجدولة)` : `Dispensed ${item.dose.toFixed(1)} mL (Scheduled Morning Dose)`;
            case 'connected':
              return ar ? 'تم الاتصال بالبوابة السحابية' : 'Connected to cloud portal';
            case 'dispensed':
              return ar ? `تم ضخ ${item.dose.toFixed(1)} مل عبر ${item.device}` : `Dispensed ${item.dose.toFixed(1)} mL on ${item.device}`;
            case 'resumed':
              return ar ? 'تم استئناف الجداول التلقائية' : 'Resumed automated schedules';
            case 'paused':
              return ar ? 'تم إيقاف الجداول التلقائية مؤقتاً' : 'Paused automated schedules';
            case 'estop':
              return ar ? 'تم تفعيل الإيقاف الطارئ' : 'Emergency stop activated';
            case 'estop_cleared':
              return ar ? 'تم إلغاء الإيقاف الطارئ' : 'Cleared emergency stop';
            case 'dose_updated':
              return ar ? `تم ضبط الجرعة إلى ${item.dose.toFixed(1)} مل` : `Updated dose to ${item.dose.toFixed(1)} mL`;
            case 'schedule_added':
              return ar ? `تمت إضافة موعد جديد الساعة ${item.schedTime}` : `Added schedule for ${item.schedTime}`;
            case 'device_updated':
              return ar ? `تم تحديث إعدادات ${item.device}` : `Updated settings for ${item.device}`;
            case 'webhook_test':
              return ar ? 'تم إرسال تجربة إلى Make.com' : 'Sent test event to Make.com webhook';
            case 'restarting':
              return ar ? `جاري إعادة تشغيل ${item.device}...` : `Restarting ${item.device}...`;
            case 'online':
              return ar ? `${item.device} عاد للعمل الآن` : `${item.device} is back online`;
            case 'factory_reset':
              return ar ? `تمت إعادة ضبط المصنع للجهاز ${item.device}` : `Factory reset performed on ${item.device}`;
            default:
              return item.text || '';
          }
        },

        switchDevice() {
          this.notify(this.lang === 'ar' ? `تم التبديل إلى ${this.currentDevice.name}` : `Switched to ${this.currentDevice.name}`);
        },

        dispenseNow() {
          if (this.currentDevice.status === 'DISPENSING' || this.currentDevice.status === 'STOPPED') return;
          const dose = Number(this.currentDevice.targetDoseMl);
          this.currentDevice.status = 'DISPENSING';
          this.progress = 0;
          this.notify(this.lang === 'ar' ? `جاري ضخ ${dose.toFixed(1)} مل...` : `Dispensing ${dose.toFixed(1)} mL...`);

          clearInterval(this.timer);
          this.timer = setInterval(() => {
            if (this.currentDevice.status !== 'DISPENSING') {
              clearInterval(this.timer);
              return;
            }
            this.progress += 12.5;
            if (this.progress >= 100) {
              clearInterval(this.timer);
              this.currentDevice.status = 'READY';
              this.currentDevice.dailyDispensedMl += dose;
              this.currentDevice.reservoirPct = Math.max(0, Math.round(this.currentDevice.reservoirPct - 1));
              this.saveAll();
              this.logEvent('dose', { key: 'dispensed', dose, device: this.currentDevice.name });
              this.notify(this.lang === 'ar' ? `اكتمل ضخ ${dose.toFixed(1)} مل بنجاح` : `Completed ${dose.toFixed(1)} mL dose`);
              this.postWebhook('dose_completed', { dose_ml: dose });
            }
          }, 250);
        },

        togglePause() {
          if (this.currentDevice.status === 'PAUSED') {
            this.currentDevice.status = 'READY';
            this.logEvent('sync', { key: 'resumed' });
            this.notify(this.lang === 'ar' ? 'تم استئناف الجداول' : 'Schedules resumed');
          } else {
            clearInterval(this.timer);
            this.currentDevice.status = 'PAUSED';
            this.logEvent('warn', { key: 'paused' });
            this.notify(this.lang === 'ar' ? 'تم إيقاف الجداول مؤقتاً' : 'Schedules paused', 'warning');
          }
          this.saveAll();
        },

        emergencyStop() {
          clearInterval(this.timer);
          if (this.currentDevice.status === 'STOPPED') {
            this.currentDevice.status = 'READY';
            this.logEvent('sync', { key: 'estop_cleared' });
            this.notify(this.lang === 'ar' ? 'الجهاز جاهز للعمل' : 'Device ready');
          } else {
            this.currentDevice.status = 'STOPPED';
            this.progress = 0;
            this.logEvent('stop', { key: 'estop' });
            this.notify(this.lang === 'ar' ? 'تم تفعيل الإيقاف الطارئ' : 'Emergency stop active', 'danger');
            this.postWebhook('emergency_stop', {});
          }
          this.saveAll();
        },

        saveDoseSettings() {
          this.saveAll();
          const dose = Number(this.currentDevice.targetDoseMl);
          this.logEvent('sync', { key: 'dose_updated', dose });
          this.notify(this.lang === 'ar' ? 'تم حفظ إعدادات الجرعة' : 'Dosing settings saved');
        },

        addSchedule() {
          if (!this.newRule.label.trim()) {
            this.notify(this.lang === 'ar' ? 'يرجى إدخال وصف للموعد' : 'Please enter a schedule label', 'warning');
            return;
          }
          const addedTime = this.newRule.time;
          this.schedules.push({
            id: Date.now(),
            label: this.newRule.label.trim(),
            time: addedTime,
            volumeMl: Number(this.newRule.volumeMl) || 5.0,
            enabled: true
          });
          this.newRule.label = '';
          this.showAddSchedule = false;
          this.saveAll();
          this.logEvent('sync', { key: 'schedule_added', schedTime: addedTime });
          this.notify(this.lang === 'ar' ? 'تمت إضافة الموعد' : 'Schedule added');
        },

        removeSchedule(idx) {
          this.schedules.splice(idx, 1);
          this.saveAll();
          this.notify(this.lang === 'ar' ? 'تم حذف الموعد' : 'Schedule removed');
        },

        updateDeviceNetwork() {
          this.saveAll();
          this.wifiPass = '';
          this.logEvent('sync', { key: 'device_updated', device: this.currentDevice.name });
          this.notify(this.lang === 'ar' ? 'تم تحديث إعدادات الجهاز' : 'Device settings updated');
        },

        saveWebhook() {
          this.saveAll();
          this.notify(this.lang === 'ar' ? 'تم حفظ رابط الويب هوك' : 'Webhook URL saved');
        },

        async postWebhook(event, data) {
          if (!this.webhookUrl) return;
          try {
            await fetch(this.webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              mode: 'no-cors',
              body: JSON.stringify({
                product: 'OMNIDOSE',
                event,
                language: this.lang,
                device: this.currentDevice.name,
                timestamp: new Date().toISOString(),
                ...data
              })
            });
          } catch (e) {}
        },

        async testWebhook() {
          await this.postWebhook('test_ping', { dose_ml: this.currentDevice.targetDoseMl });
          this.logEvent('sync', { key: 'webhook_test' });
          this.notify(this.lang === 'ar' ? 'تم إرسال التجربة إلى Make.com' : 'Test event sent to Make.com');
        },

        restartDevice() {
          const dev = this.currentDevice;
          dev.status = 'RESTARTING';
          dev.uptimeSec = 0;
          this.logEvent('warn', { key: 'restarting', device: dev.name });
          this.notify(this.lang === 'ar' ? 'جاري إعادة تشغيل الجهاز...' : 'Restarting device...', 'warning');
          setTimeout(() => {
            dev.status = 'READY';
            this.logEvent('sync', { key: 'online', device: dev.name });
            this.notify(this.lang === 'ar' ? 'الجهاز متصل الآن' : 'Device online');
          }, 2500);
        },

        factoryReset() {
          if (!confirm(this.t('confirmReset'))) return;
          localStorage.removeItem('omni_simple_devices');
          localStorage.removeItem('omni_simple_schedules');
          this.currentDevice.targetDoseMl = 5.0;
          this.currentDevice.flowRateMlMin = 25;
          this.currentDevice.calibrationOffset = 0.0;
          this.currentDevice.status = 'READY';
          this.logEvent('stop', { key: 'factory_reset', device: this.currentDevice.name });
          this.notify(this.lang === 'ar' ? 'تمت إعادة ضبط المصنع' : 'Reset to factory defaults', 'danger');
        },

        logEvent(type, payload) {
          const locale = this.lang === 'ar' ? 'ar-SA' : 'en-US';
          const time = new Date().toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
          this.activityFeed.unshift({ type, ...payload, time });
          if (this.activityFeed.length > 12) this.activityFeed.pop();
        },

        notify(message, type = 'success') {
          this.toast = { show: true, type, message };
          setTimeout(() => { this.toast.show = false; }, 3200);
        }
      };
    }
  </script>
</body>
